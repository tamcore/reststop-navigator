name: E2E Tests

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

permissions:
  contents: read

jobs:
  test-e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - name: Start app stack
        run: docker compose -f docker-compose.dev.yaml up -d --build --wait

      - name: Show container logs on failure
        if: failure()
        run: docker compose -f docker-compose.dev.yaml logs

      - name: Wait for backend healthcheck
        run: |
          for i in $(seq 1 30); do
            if curl -fsS http://localhost:8080/api/healthz; then
              echo
              exit 0
            fi
            sleep 2
          done
          echo "backend never became healthy" >&2
          exit 1

      - name: Set up Node
        uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f # v6.3.0
        with:
          node-version: '24'

      - name: Restore Playwright browser cache
        id: playwright-cache
        uses: actions/cache@0400d5f644dc74513175e3cd8d07132dd4860809 # v4.2.4
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-chromium-${{ hashFiles('web/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-playwright-chromium-

      - name: Install frontend deps
        working-directory: ./web
        run: npm ci

      - name: Install Playwright OS dependencies
        working-directory: ./web
        run: npx playwright install-deps chromium

      - name: Install Playwright browsers
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        timeout-minutes: 3
        working-directory: ./web
        run: npx playwright install chromium

      - name: Run Playwright tests
        working-directory: ./web
        env:
          E2E_BASE_URL: http://localhost:8080
        run: npx playwright test

      - name: Upload playwright report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: playwright-report
          path: web/playwright-report/
          retention-days: 7
