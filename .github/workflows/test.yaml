name: Unit Tests

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

permissions:
  contents: read

env:
  COVERAGE_THRESHOLD: 80

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      - name: go vet
        run: go vet ./...

      - name: golangci-lint
        uses: golangci/golangci-lint-action@82606bf257cbaff209d206a39f5134f0cfbfd2ee # v9.2.1
        with:
          version: latest
          args: --timeout=5m

  test-backend:
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      - name: Run tests
        # -coverpkg=./internal/... so cmd/ entrypoints don't dilute the gate;
        # ./... still runs all tests to catch build breakage everywhere.
        run: go test -v -race -coverprofile=coverage.out -coverpkg=./internal/... ./...

      - name: Coverage gate
        run: |
          if [ ! -s coverage.out ] || ! grep -q '/internal/' coverage.out; then
            echo "No internal/ packages with tests yet — skipping coverage gate."
            exit 0
          fi
          go tool cover -func=coverage.out
          TOTAL=$(go tool cover -func=coverage.out | awk '/^total:/ {print $3}' | tr -d '%')
          echo "Total internal/ coverage: ${TOTAL}%"
          awk -v c="$TOTAL" -v t="${COVERAGE_THRESHOLD}" 'BEGIN { if (c+0 < t+0) { printf("Coverage %s%% is below threshold %s%%\n", c, t); exit 1 } }'
