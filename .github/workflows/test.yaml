name: Unit Tests

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

permissions:
  contents: read

env:
  COVERAGE_THRESHOLD: 80

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - name: Set up Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version-file: go.mod

      - name: go vet
        run: go vet ./...

      - name: golangci-lint
        uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: latest
          args: --timeout=5m

  test-backend:
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - name: Set up Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version-file: go.mod

      - name: Run tests
        # -coverpkg=./internal/... so cmd/ entrypoints don't dilute the gate;
        # ./... still runs all tests to catch build breakage everywhere.
        run: go test -v -race -coverprofile=coverage.out -coverpkg=./internal/... ./...

      - name: Coverage gate
        run: |
          if [ ! -s coverage.out ] || ! grep -q '/internal/' coverage.out; then
            echo "No internal/ packages with tests yet — skipping coverage gate."
            exit 0
          fi
          go tool cover -func=coverage.out
          TOTAL=$(go tool cover -func=coverage.out | awk '/^total:/ {print $3}' | tr -d '%')
          echo "Total internal/ coverage: ${TOTAL}%"
          awk -v c="$TOTAL" -v t="${COVERAGE_THRESHOLD}" 'BEGIN { if (c+0 < t+0) { printf("Coverage %s%% is below threshold %s%%\n", c, t); exit 1 } }'
