name: Unit Tests

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

permissions:
  contents: read

env:
  COVERAGE_THRESHOLD: 80

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - name: Set up Go
        uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6.4.0
        with:
          go-version-file: go.mod

      - name: go vet
        run: go vet ./...

      - name: golangci-lint
        uses: golangci/golangci-lint-action@4afd733a84b1f43292c63897423277bb7f4313a9 # v8.0.0
        with:
          version: latest
          args: --timeout=5m

  test-backend:
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - name: Set up Go
        uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6.4.0
        with:
          go-version-file: go.mod

      - name: Run tests
        # -coverpkg=./internal/... so cmd/ entrypoints don't dilute the gate;
        # ./... still runs all tests to catch build breakage everywhere.
        run: go test -v -race -coverprofile=coverage.out -coverpkg=./internal/... ./...

      - name: Coverage gate
        run: |
          if [ ! -s coverage.out ] || ! grep -q '/internal/' coverage.out; then
            echo "No internal/ packages with tests yet — skipping coverage gate."
            exit 0
          fi
          go tool cover -func=coverage.out
          TOTAL=$(go tool cover -func=coverage.out | awk '/^total:/ {print $3}' | tr -d '%')
          echo "Total internal/ coverage: ${TOTAL}%"
          awk -v c="$TOTAL" -v t="${COVERAGE_THRESHOLD}" 'BEGIN { if (c+0 < t+0) { printf("Coverage %s%% is below threshold %s%%\n", c, t); exit 1 } }'
