replicaCount: 2

image:
  repository: ghcr.io/tamcore/reststop-navigator
  tag: ""
  digest: ""
  pullPolicy: IfNotPresent

imagePullSecrets: []

resources:
  requests:
    cpu: 100m
    memory: 128Mi
  limits:
    cpu: 500m
    memory: 512Mi

service:
  type: ClusterIP
  port: 8080

ingress:
  enabled: true
  className: nginx
  annotations: {}
  hosts:
    - restops.85.215.177.78.meh.wf
  tls: []
  # Example with cert-manager:
  # annotations:
  #   cert-manager.io/cluster-issuer: letsencrypt-prod
  # tls:
  #   - secretName: reststop-navigator-tls
  #     hosts:
  #       - restops.85.215.177.78.meh.wf

# Gateway API HTTPRoute is no longer the default (the prod cluster's wildcard
# DNS *.85.215.177.78.meh.wf points at the ingress-controller, not a Gateway).
# Set httpRoute.enabled=true to opt back in.
httpRoute:
  enabled: false
  hostnames:
    - restops.85.215.177.78.meh.wf
  parentRefs:
    - name: nginx
      namespace: nginx-gateway

env:
  RESTSTOP_LISTEN_ADDR: ":8080"
  RESTSTOP_REFRESH_INTERVAL: "168h"
  RESTSTOP_OVERPASS_ENDPOINTS: "https://overpass-api.de/api/interpreter,https://overpass.kumi.systems/api/interpreter"

# In-chart Redis (single replica, no persistence). Set redis.enabled=false to
# point at an external Redis via externalRedisURL.
redis:
  enabled: true
  image: redis:7-alpine
  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      cpu: 200m
      memory: 128Mi

externalRedisURL: ""

podDisruptionBudget:
  enabled: true
  minAvailable: 1

podLabels: {}
podAnnotations: {}
nodeSelector: {}
tolerations: []
affinity: {}
