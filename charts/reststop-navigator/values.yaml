replicaCount: 2

image:
  repository: ghcr.io/tamcore/reststop-navigator
  tag: ""
  digest: ""
  pullPolicy: IfNotPresent

imagePullSecrets: []

resources:
  requests:
    cpu: 100m
    memory: 128Mi
  limits:
    cpu: 500m
    memory: 512Mi

# Pod-level security context for the app. The image runs a static Go binary,
# so nonroot + read-only rootfs work out of the box.
podSecurityContext:
  runAsNonRoot: true
  runAsUser: 65532
  runAsGroup: 65532
  seccompProfile:
    type: RuntimeDefault

# Container-level security context for the app.
securityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  capabilities:
    drop:
      - ALL

service:
  type: ClusterIP
  port: 8080

ingress:
  enabled: true
  className: nginx
  # cert-manager + nginx-ingress: provision a Let's Encrypt cert for the
  # listed hostnames, force HTTPS, and pin the secretName so the chart
  # template can reference it from spec.tls.
  certManagerIssuer: letsencrypt-prod
  annotations: {}
  # Override hosts/tls at deploy time, e.g.
  #   --set ingress.hosts[0]=<your-fqdn>
  #   --set ingress.tls[0].hosts[0]=<your-fqdn>
  hosts: []
  tls: []

# Gateway API HTTPRoute is opt-in. Override hostnames and parentRefs at deploy
# time via --set when enabling.
httpRoute:
  enabled: false
  hostnames: []
  parentRefs: []

env:
  RESTSTOP_LISTEN_ADDR: ":8080"
  RESTSTOP_REFRESH_INTERVAL: "168h"
  RESTSTOP_OVERPASS_ENDPOINTS: "https://overpass-api.de/api/interpreter,https://overpass.kumi.systems/api/interpreter"

# In-chart Redis (single replica, no persistence). Set redis.enabled=false to
# point at an external Redis via externalRedisURL.
redis:
  enabled: true
  image: redis:8-alpine
  # uid/gid of the redis user in the official alpine image.
  podSecurityContext:
    runAsNonRoot: true
    runAsUser: 999
    runAsGroup: 1000
    fsGroup: 1000
    seccompProfile:
      type: RuntimeDefault
  securityContext:
    allowPrivilegeEscalation: false
    readOnlyRootFilesystem: true
    capabilities:
      drop:
        - ALL
  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      cpu: 200m
      memory: 128Mi

externalRedisURL: ""

# Restrict Redis ingress to the app pods. Only rendered when the in-chart
# Redis is enabled; requires a CNI that enforces NetworkPolicy.
networkPolicy:
  enabled: true

podDisruptionBudget:
  enabled: true
  minAvailable: 1

podLabels: {}
podAnnotations: {}
nodeSelector: {}
tolerations: []
affinity: {}
