<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
		<meta name="theme-color" content="#0b1220" />
		<meta name="description" content="Find upcoming highway rest stops on your route - fuel, EV charging, food, toilets, dog-friendly. Works in DE, AT, SK, CZ." />
		<link rel="manifest" href="/manifest.webmanifest" />
		<link rel="icon" type="image/x-icon" href="%sveltekit.assets%/favicon.ico" />
		<link rel="icon" type="image/png" sizes="32x32" href="%sveltekit.assets%/icons/icon-32.png" />
		<link rel="apple-touch-icon" sizes="180x180" href="%sveltekit.assets%/apple-touch-icon.png" />
		<title>Reststop Navigator</title>
		<script>
			(function () {
				try {
					var m = document.cookie.match(/(?:^|;\s*)reststop-theme=(auto|light|dark)/);
					var t = m && m[1];
					if (t === 'light' || t === 'dark') {
						document.documentElement.setAttribute('data-theme', t);
					}
				} catch (_) {}
			})();
		</script>
		%sveltekit.head%
	</head>
	<body data-sveltekit-preload-data="hover">
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
